#对于一个节点来说，它的名称应当保持一致（在“配置文件”，“源文件”以及“launch文件”中）
arm_solve_server:
  ros__parameters:
    group_name: arm5dof_arm
    goal_position_tolerance: 0.001
    goal_orientation_tolerance: 0.001
    planning_time: 2.0
    num_planning_attempts: 5
    log_throttle_sec: 1.0

joint_controller_node:
  ros__parameters:
    collect_interval: 200 # ms